[project]
name = "infinity-data"
version = "0.1.0"
description = "InfinityData：声明式配置语言（.infd/.inft）的 Python 编译器库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.21",
    "pyright",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ASYNC",  # async/await best practices
    "PLE",    # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "ASYNC109", # async function with timeout parameter (intentional API design)
]

[tool.ruff.lint.isort]
known-first-party = ["infinity_data"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "error"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]
venvPath = "."
venv = ".venv"
