[project]
name = "infinity-data"
version = "3.2.0"
description = "InfinityData：声明式配置语言（.infd/.inft）的 Python 编译器库"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "infinity_system: yin_bailiang" },
]
keywords = [
    "config",
    "configuration",
    "declarative",
    "dsl",
    "compiler",
    "infinity-data",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
infd-lsp = "infinity_data.tools.lsp.__main__:main"
infd-cov = "infinity_data.tools.cov.__main__:main"

[project.optional-dependencies]
# 工具 extra：infd-lsp / infd-cov 的可选运行依赖（uv add 'infinity_data[tool]'）
tool = [
    "pyyaml",    # !file 的 yaml/yml 格式导入（LSP / 编译器）
    "tomli-w",   # infd-cov -f toml 输出
]

[project.urls]
Repository = "https://github.com/yinbailiang/infinity_data"
Documentation = "https://github.com/yinbailiang/infinity_data#readme"

[dependency-groups]
# 工具组：cli/lsp 工具的可选运行依赖（测试/开发组保证安装，测试可依赖它们存在）
tool = [
    "tomli-w",   # infd-cov -f toml 输出
    "pyyaml",    # !file 的 yaml/yml 格式导入（LSP / 编译器）
]
# 测试组：仅运行测试所需（CI test job 只装这组，更快）
test = [
    "pyyaml",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    { include-group = "tool" },
]
# 开发组：lint/类型/钩子 + 测试组（本地开发与 CI pre-commit job 装这组）
dev = [
    "ruff>=0.15.21",
    "pyright",
    "pre-commit>=4.0",
    "interrogate>=1.7.0",
    { include-group = "test" },
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infinity_data = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ASYNC",  # async/await best practices
    "PLE",    # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "ASYNC109", # async function with timeout parameter (intentional API design)
]

[tool.ruff.lint.isort]
known-first-party = ["infinity_data"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "error"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv", "build"]
venvPath = "."
venv = ".venv"

[tool.interrogate]
fail-under = 60
# 测试函数名自解释，docstring 可选；产品代码（src）不豁免
ignore-regex = ["^test_"]
