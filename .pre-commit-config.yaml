# 提交前钩子（参考 infinity_bus）：uv + pre-commit
#
# 安装：uv run pre-commit install
# 全量运行：uv run pre-commit run --all-files
#
# Python 风格/类型/测试统一交给 pre-commit 与 CI；
# 本地 pytest-cov 钩子保证提交时测试全绿且覆盖率达标；
# docs-build 钩子保证 MKDocs 导航与链接在提交前可用。

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
        exclude: '\.py$'
      - id: trailing-whitespace
        exclude: '\.py$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^src/|^tests/
      - id: ruff-format
        files: ^src/|^tests/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        args: ["--level", "error"]
        files: ^src/|^tests/

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ["--fail-under=80"]
        files: ^src/
        # 阈值是项目级指标；增量提交只扫描被改文件会把整体覆盖率拉低
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest coverage
        entry: uv run pytest --cov=infinity_data --cov-fail-under=90 -q
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: docs-build
        name: mkdocs build (strict)
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        always_run: true

      # 防漂移：AGENT.md 与 .agents/ 为 agent-kit 渲染产物，必须与模板保持一致。
      # 检测到漂移时先运行 `uv run agent-kit update`，再重新提交。
      - id: agent-kit-check
        name: agent-kit drift check
        entry: uv run agent-kit update --check
        language: system
        pass_filenames: false
        always_run: true
